<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 档案库</title>

<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<script>
  (function () {
    try {
      var v = localStorage.getItem('ef-theme');
      if (v === 'light' || v === 'dark') {
        document.documentElement.setAttribute('data-theme', v);
        document.documentElement.style.colorScheme = v;
      }
    } catch (e) {}
  })();
</script>

  <!-- ================= 侧栏 =================

  <!-- ================= 主内容 ================= -->
  <main class="ef-main" id="ef-main">
    <div class="ef-content ef-stack">

      <header class="ef-page-header">
        <nav aria-label="面包屑">
          <ol class="ef-breadcrumb">
            <li><a href="home.html">首页</a></li>
            <li><span aria-current="page">设置</span></li>
          </ol>
        </nav>
        <div class="ef-page-header__row">
          <div class="ef-page-header__main">
            <h1 class="ef-page-header__title">设置</h1>
            <div class="ef-page-header__meta"><span>管理你的偏好</span></div>
          </div>
        </div>
      </header>

      <section class="ef-panel" data-tabs>
        <div class="ef-tabs__list" role="tablist" aria-label="设置分类">
          <button class="ef-tabs__tab" role="tab" id="tabProfile" aria-controls="panelProfile" aria-selected="true" type="button">个人资料</button>
          <button class="ef-tabs__tab" role="tab" id="tabAppearance" aria-controls="panelAppearance" aria-selected="false" type="button">外观</button>
          <button class="ef-tabs__tab" role="tab" id="tabNotify" aria-controls="panelNotify" aria-selected="false" type="button">通知</button>
          <button class="ef-tabs__tab" role="tab" id="tabSecurity" aria-controls="panelSecurity" aria-selected="false" type="button">安全</button>
        </div>

        <div class="ef-panel__body">

          <!-- ---------- 个人资料 ---------- -->
          <div class="ef-tabs__panel" role="tabpanel" id="panelProfile" aria-labelledby="tabProfile" tabindex="0">
            <div class="ef-field">
              <label class="ef-label" for="setName">显示名称</label>
              <input class="ef-input" id="setName" name="displayName" value="示例编辑者" autocomplete="nickname">
            </div>
            <div class="ef-field">
              <label class="ef-label" for="setMail">邮箱</label>
              <input class="ef-input" id="setMail" name="email" type="email" value="user@example.com" autocomplete="email">
            </div>
            <div class="ef-field">
              <label class="ef-label" for="setBio">个人简介</label>
              <textarea class="ef-textarea" id="setBio" name="bio" placeholder="写点什么…">示例简介文本。</textarea>
            </div>
            <button class="ef-btn ef-btn--primary" type="button">保存</button>
          </div>

          <!-- ---------- 外观 ---------- -->
          <div class="ef-tabs__panel" role="tabpanel" id="panelAppearance" aria-labelledby="tabAppearance" tabindex="0" hidden>
            <fieldset style="border:0;padding:0;margin:0 0 var(--ef-space-5)">
              <legend class="ef-label" style="padding:0;margin-bottom:var(--ef-space-2)">主题</legend>
              <div class="ef-stack" style="gap:var(--ef-space-2)">
                <label class="ef-radio"><input type="radio" name="theme" value="system" data-theme-radio> 跟随系统</label>
                <label class="ef-radio"><input type="radio" name="theme" value="light" data-theme-radio> 浅色</label>
                <label class="ef-radio"><input type="radio" name="theme" value="dark" data-theme-radio> 深色</label>
              </div>
            </fieldset>

            <hr class="ef-divider">

            <div class="ef-stack" style="gap:var(--ef-space-3)">
              <label class="ef-switch"><input type="checkbox" name="compact"> 紧凑模式</label>
              <label class="ef-switch"><input type="checkbox" name="grid" checked> 显示网格底纹</label>
            </div>

            <hr class="ef-divider">

            <div class="ef-field" style="max-width:20rem">
              <label class="ef-label" for="setLang">语言</label>
              <select class="ef-select" id="setLang" name="lang">

                <option value="en">English</option>
                <option value="ja">日本語</option>

            </div>
          </div>

          <!-- ---------- 通知 ---------- -->
          <div class="ef-tabs__panel" role="tabpanel" id="panelNotify" aria-labelledby="tabNotify" tabindex="0" hidden>

              <label class="ef-switch"><input type="checkbox" name="notifyEntry" checked> 条目更新</label>
              <label class="ef-switch"><input type="checkbox" name="notifyReply" checked> 回复提醒</label>
              <label class="ef-switch"><input type="checkbox" name="notifyDigest"> 每周摘要</label>
              <label class="ef-switch"><input type="checkbox" name="notifySecurity" checked> 安全告警</label>
            </div>
          </div>

          <!-- ---------- 安全 ---------- -->
          <div class="ef-tabs__panel" role="tabpanel" id="panelSecurity" aria-labelledby="tabSecurity" tabindex="0" hidden>
            <div class="ef-field" style="max-width:20rem">
              <label class="ef-label" for="setOldPass">当前密码</label>
              <input class="ef-input" id="setOldPass" name="currentPassword" type="password" autocomplete="current-password">
            </div>
            <div class="ef-field" style="max-width:20rem">
              <label class="ef-label" for="setNewPass">新密码</label>
              <input class="ef-input" id="setNewPass" name="newPassword" type="password" autocomplete="new-password">
            </div>

            <hr class="ef-divider">

            <label class="ef-switch" style="margin-bottom:var(--ef-space-5)"><input type="checkbox" name="twofa"> 两步验证</label>

            <div>
              <button class="ef-btn ef-btn--danger" type="button">注销所有会话</button>
            </div>
          </div>

        </div>

  <!-- 遮罩必须是 .ef-app 的子元素：显示规则是后代选择器 .ef-app.is-open .ef-scrim，
       且不能带 hidden 属性，否则抽屉打开时遮罩永远不显示。 -->
  <div class="ef-scrim" aria-hidden="true"></div>
</div>

<script src="../js/theme.js"></script>
<script>
  /* 外观面板的三选一必须与三态主题联动：EFTheme.get() 返回 system/light/dark，
     而 data-theme 属性只在 light/dark 时写入，system 时移除。 */
  (function () {
    var radios = document.querySelectorAll('[data-theme-radio]');
    if (!radios.length || !window.EFTheme) return;

    function sync() {
      var current = window.EFTheme.get();
      Array.prototype.forEach.call(radios, function (r) {
        r.checked = r.value === current;
      });
    }

    Array.prototype.forEach.call(radios, function (r) {
      r.addEventListener('change', function () {
        if (r.checked) window.EFTheme.set(r.value);
      });
    });

    sync();
    window.EFTheme.onChange(sync);
  })();
</script>
<script src="../js/ui.js"></script>
</body>
